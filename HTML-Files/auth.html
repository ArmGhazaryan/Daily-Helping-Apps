<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHA - Account</title>
    <link rel="icon" type="image/png" href="../Img/logo.png">
    
    <!-- CSS Ֆայլեր -->
    <link rel="stylesheet" href="../CSS-Files/main.css">
    <link rel="stylesheet" href="../CSS-Files/auth.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="auth-header">
        <a href="../index.html" class="dha-brand" title="Daily Helping Apps">
            <span class="letter">D</span><span class="expand">aily</span>
            <span class="letter">H</span><span class="expand">elping</span>
            <span class="letter">A</span><span class="expand">pps</span>
        </a>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <!-- Tabs Switcher -->
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">Login</button>
                <button id="tab-signup" class="tab-btn">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="example@mail.com" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form hidden">
                <div class="input-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" placeholder="Arman" required>
                </div>
                <div class="input-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="example@mail.com" required>
                </div>
                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Min. 6 characters" required minlength="6">
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <!-- Google Sign-In -->
            <div class="auth-divider"><span>or</span></div>
            <button type="button" class="google-btn google-signin-btn">
                <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <!-- Status Message -->
            <p id="auth-message" class="auth-message"></p>
        </div>
    </main>

    <!-- JS Ֆայլեր -->
    <script src="../Javascript-Files/supabase.js"></script>
    <script src="../Javascript-Files/auth.js"></script>
</body>
</html>
