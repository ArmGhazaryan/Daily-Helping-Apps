<!DOCTYPE html>
<html lang="hy" translate="no" class="notranslate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Mafia Manager - Կարմիր թե Սև</title>
    <link rel="icon" type="image/png" href="../Img/logo.png">
    <link rel="stylesheet" href="../css/mafia-manager.css">
    <link rel="stylesheet" href="../css/global-auth.css">
</head>

<body>
    <header>
        <!-- 🟢 DHA Brand Logo (Հղումը տանում է դեպի index.html) -->
        <a href="../index.html" class="dha-brand" title="Daily Helping Apps">
            <span class="letter">D</span><span class="expand">aily</span>
            <span class="letter">H</span><span class="expand">elping</span>
            <span class="letter">A</span><span class="expand">pps</span>
        </a>
        <div class="header-right">
            <div id="auth-header-container"></div>
        </div>
    </header>

    <div id="app">
        <!-- ===== Step 1 — Game Setup (Կարգավորում) ===== -->
        <div id="step-setup" class="step active">
            <div class="setup-brand">
                <h1>ԿԱՐՄԻՐ ԹԵ ՍԵՎ</h1>
                <p>Խաղավարի Վահանակ</p>
            </div>
            <div class="setup-card">
                <div class="setup-section">
                    <span class="setup-section-label">Կարմիրներ</span>
                    <div class="counter-row">
                        <div>
                            <span class="counter-label">Կարմիրներ</span>
                            <span class="counter-subtext"> ներառում 1 Շերիֆ</span>
                        </div>
                        <div class="counter-controls">
                            <button id="btnRedMinus" class="counter-btn" aria-label="Կարմիր նվազեցնել">−</button>
                            <span id="valRed" class="counter-value">7</span>
                            <button id="btnRedPlus" class="counter-btn" aria-label="Կարմիր ավելացնել">+</button>
                        </div>
                    </div>
                </div>
                <div class="setup-section">
                    <span class="setup-section-label">Մաֆիա</span>
                    <div class="counter-row">
                        <div>
                            <span class="counter-label">Մաֆիա</span>
                            <span class="counter-subtext" id="subMafia"> ներառյալ 1 Դոն</span>
                        </div>
                        <div class="counter-controls">
                            <button id="btnMafiaMinus" class="counter-btn" aria-label="Մաֆիա նվազեցնել">−</button>
                            <span id="valMafia" class="counter-value">3</span>
                            <button id="btnMafiaPlus" class="counter-btn" aria-label="Մաֆիա ավելացնել">+</button>
                        </div>
                    </div>
                </div>
                <div class="setup-roles-hint">
                    Դեր: Կարմիր ・ Շերիֆ ・ Մաֆիա ・ Դոն
                </div>
                <button id="btnStartSetup" class="btn-play">Խաղալ</button>
            </div>
        </div>

        <!-- ===== Step 2 — Sequential Role Reveal (Դեր uncover) ===== -->
        <div id="step-role" class="step">
            <div class="step-top-bar">
                <button id="btnExitRole" class="btn-exit-fullscreen">✕ Դուրս գալ</button>
            </div>
            <div class="role-header">
                <div id="rolePlayerTitle" class="role-player-title">Խաղացող 1</div>
                <div class="role-player-subtitle">Դերը թաքցված է</div>
            </div>
            <div class="role-card-container">
                <div id="roleCard" class="role-card face-down">
                    <div class="face face-down">
                        <div class="role-back-label">Դերը թաքցված է</div>
                        <div class="role-back-label">Սեղմել «Տեսնել»</div>
                    </div>
                    <div class="face face-up hidden">
                        <div id="roleReveal" class="role-reveal">🎭</div>
                        <div id="roleName" class="role-name">Կարմիր</div>
                        <div id="roleSub" class="role-sub">Կարմիր</div>
                    </div>
                </div>
            </div>
            <button id="roleActionBtn" class="role-btn">Տեսնել</button>
            <button id="roleStartGame" class="role-start-game hidden">Սկսել խաղը</button>
        </div>

        <!-- ===== Step 3 — Moderator Control Screen (Վարողի էկրան) ===== -->
        <div id="step-mod" class="step">
            <div class="step-top-bar">
                <button id="btnExitMod" class="btn-exit-fullscreen">Նոր խաղ</button>
            </div>
            <div class="mod-status-header">
                <div class="mod-counts">
                    <span class="mod-count mod-count-karmir">Կարմիրներ: <span id="cntKarmir">7</span></span>
                    <span class="mod-count mod-count-mafia">Մաֆիա: <span id="cntMafia">3</span></span>
                </div>
                <button id="btnNewGameMod" class="btn-new-game-mod">Նոր խաղ</button>
            </div>
            <div class="player-list" id="playerList"></div>
        </div>
    </div>

    <!-- Fixed bottom speech timer bar (Step 3) -->
    <div id="timer-bar" class="timer-bar hidden">
        <button id="btnStartTimer" class="btn btn-start-timer">Սկսել ժամանակը</button>
        <div id="timerDisplay" class="timer-display">60</div>
        <button id="btnResetTimer" class="btn btn-reset-timer">Զրոյացնել</button>
    </div>

    <!-- Win modal -->
    <div id="win-modal" class="win-modal hidden">
        <div class="win-modal-card">
            <h2 id="winTitle" class="win-title">Հաղթեցին Կարմիրները</h2>
            <p id="winSub" class="win-sub"></p>
            <button id="btnWinNewGame" class="btn-new-game-modal">Նոր խաղ</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/global-auth.js"></script>
    <script src="../js/mafia-manager.js"></script>
</body>
</html>
