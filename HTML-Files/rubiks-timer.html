<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Rubik's Timer</title>
    <link rel="icon" type="image/png" href="../Img/logo.png">
    <link rel="stylesheet" href="../css/rubiks-timer.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/global-auth.css">

</head>
<body>
    <header>
        <a href="../index.html" class="dha-brand" title="Daily Helping Apps">
            <span class="letter">D</span><span class="expand">aily</span>
            <span class="letter">H</span><span class="expand">elping</span>
            <span class="letter">A</span><span class="expand">pps</span>
        </a>
        <div class="header-right">
            <div id="auth-header-container"></div>
        </div>
    </header>

    <main class="rubiks-container">
        <section class="scramble-section">
            <div id="scramble" class="scramble">R U R' U' ...</div>
            <div class="scramble-actions">
                <button id="newScrambleBtn" class="btn">New Scramble</button>
                <label class="inspection-toggle">
                    <input type="checkbox" id="inspectionToggle"> 15s Inspection
                </label>
            </div>
            <div id="inspectionDisplay" class="inspection-display"></div>
        </section>

        <section id="timerArea" class="timer-area" tabindex="0" aria-label="Timer">
            <div id="timerDisplay" class="timer-display">0.000</div>
            <div class="timer-hint">Hold (touch/spacebar) to ready, release to start. Tap/space to stop.</div>
        </section>

        <section class="stats-section">
            <div class="stat"><span class="stat-label">PB</span><span id="pb" class="stat-value">-</span></div>
            <div class="stat"><span class="stat-label">Ao5</span><span id="ao5" class="stat-value">-</span></div>
            <div class="stat"><span class="stat-label">Ao12</span><span id="ao12" class="stat-value">-</span></div>
        </section>

        <section class="history-section">
            <div class="history-header">
                <h2>Solve History</h2>
                <button id="toggleHistory" class="btn">Toggle</button>
            </div>
            <div id="historyList" class="history-list"></div>
        </section>
    </main>
    <!-- 🟢 Admin Analytics & User Insights (admin-only) -->
    <section id="adminInsights" class="admin-console is-hidden" aria-label="Admin Console">
        <div class="admin-console-header">
            <span class="admin-badge">👑 Admin Console</span>
            <div class="admin-console-actions">
                <button id="adminRefreshBtn" class="admin-btn primary" type="button">Refresh Stats</button>
                <button id="adminToggleBtn" class="admin-btn" type="button" aria-expanded="true">Collapse</button>
            </div>
        </div>
        <div class="admin-console-body" id="adminConsoleBody">
            <div class="admin-metrics-grid">
                <div class="admin-metric-card">
                    <div class="admin-metric-label">👥 Total Registered Users</div>
                    <div class="admin-metric-value" id="adminTotalUsers">—</div>
                </div>
                <div class="admin-metric-card">
                    <div class="admin-metric-label">📊 Total Flashcards Created</div>
                    <div class="admin-metric-value" id="adminTotalFlashcards">—</div>
                </div>
                <div class="admin-metric-card">
                    <div class="admin-metric-label">⏱️ Total Solves Recorded</div>
                    <div class="admin-metric-value" id="adminTotalSolves">—</div>
                </div>
                <div class="admin-metric-card">
                    <div class="admin-metric-label">✅ Total Tasks Logged</div>
                    <div class="admin-metric-value" id="adminTotalTasks">—</div>
                </div>
            </div>
            <div class="admin-activity">
                <h3>⏱️ Recent User Activity</h3>
                <ul id="adminActivityLog" class="admin-activity-list"></ul>
            </div>
            <div id="adminStatus" class="admin-status"></div>
        </div>
    </section>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/header-auth.js"></script>
    <script src="../js/rubiks-timer.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/global-auth.js" defer></script>

</body>
</html>
